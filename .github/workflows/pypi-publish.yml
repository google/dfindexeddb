name: Publish Python distribution to PyPI

on: push

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Set up Python
      uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
      with:
        python-version: "3.x"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
    - name: Build package
      run: python -m build
    - name: Store the distribution packages
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: python-package-distributions
        path: dist/

  publish-to-pypi:
    name: >-
      Publish Python distribution to PyPI
    if: startsWith(github.ref, 'refs/tags/')  # only publish to PyPI on tag pushes
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dfindexeddb

    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
      with:
        name: python-package-distributions
        path: dist/
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.12"
    - name: Authenticate to Google Cloud (OSS Exit Gate)
      uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
      with:
        workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
    - name: Clean up failed staging attempt for this exact version (if any)
      id: exit_gate_cleanup
      run: |
        set -euo pipefail
        PKG_VER=$(python3 -c 'import email, glob, os, tarfile, zipfile; files = sorted(glob.glob("dist/*.whl") + glob.glob("dist/*.tar.gz")); assert files, "No distributions found in dist/"; p = files[0]; meta = (  zipfile.ZipFile(p).read([n for n in zipfile.ZipFile(p).namelist() if n.endswith(".dist-info/METADATA")][0])  if p.endswith(".whl") else   tarfile.open(p).extractfile([m for m in tarfile.open(p).getmembers() if m.name.endswith("/PKG-INFO") or m.name == "PKG-INFO"][0]).read()); print(email.message_from_bytes(meta)["Version"].strip())')
        echo "pkg_ver=${PKG_VER}" >> "$GITHUB_OUTPUT"
        set +e
        gcloud artifacts versions describe "${PKG_VER}" \
          --package="dfindexeddb" \
          --project="oss-exit-gate-prod" \
          --location="us" \
          --repository="dfindexeddb--pypi" \
          --format="value(name)" > /dev/null 2> describe.err
        DESC_RC=$?
        set -e
        if [ "$DESC_RC" -eq 0 ]; then
          echo "Deleting incomplete staged version ${PKG_VER} before retry..."
          gcloud artifacts versions delete "${PKG_VER}" \
            --package="dfindexeddb" \
            --project="oss-exit-gate-prod" \
            --location="us" \
            --repository="dfindexeddb--pypi" \
            --quiet
        elif grep -Eqi "NOT_FOUND|not.found|404" describe.err; then
          echo "Version ${PKG_VER} not present in staging repository — proceeding with fresh upload"
        else
          cat describe.err >&2
          exit "$DESC_RC"
        fi
    - name: Stage distributions to OSS Exit Gate and upload manifest
      env:
        PKG_VER: ${{ steps.exit_gate_cleanup.outputs.pkg_ver }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        set -euo pipefail
        python3 -m pip install --upgrade twine
        TWINE_PASSWORD="$(gcloud auth print-access-token)"
        python3 -m twine upload \
          --repository-url "https://us-python.pkg.dev/oss-exit-gate-prod/dfindexeddb--pypi/" \
          -u oauth2accesstoken \
          -p "${TWINE_PASSWORD}" \
          dist/*
        cat <<EOF > manifest.json
        {
          "publish_all": false,
          "publishing_groups": [
            {
              "packages": [
                {
                  "name": "dfindexeddb",
                  "version": "${PKG_VER}"
                }
              ]
            }
          ]
        }
        EOF
        gcloud storage cp manifest.json \
          "gs://oss-exit-gate-prod-projects-bucket/dfindexeddb/pypi/manifests/manifest-${PKG_VER}-${RUN_ID}-${RUN_ATTEMPT}.json"

  github-release:
    name: Sign the Python distribution with Sigstore and upload them to GitHub Release
    needs:
    - publish-to-pypi
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
      with:
        name: python-package-distributions
        path: dist/
    - name: Sign the dists with Sigstore
      uses: sigstore/gh-action-sigstore-python@f514d46b907ebcd5bedc05145c03b69c1edd8b46 # v3.0.0
      with:
        inputs: >-
          ./dist/*.tar.gz
          ./dist/*.whl
    - name: Upload artifact signatures to GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      # Upload to GitHub Release using the `gh` CLI.
      # `dist/` contains the built packages, and the
      # sigstore-produced signatures and certificates.
      run: >-
        gh release upload
        '${GITHUB_REF_NAME}' dist/**
        --repo '${{ github.repository }}'
