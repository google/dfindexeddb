<html>
  <head></head>
  <body>
    <script type="text/javascript">
      (function () {
        const open = indexedDB.open("IndexedDB test", 1);

        open.onupgradeneeded = function () {
          var db = open.result;
          var store_a = db.createObjectStore("test store a", {
            keyPath: "id",
            autoIncrement: true,
          });
          var empty_store = db.createObjectStore("empty store", {
            keyPath: "id",
          });
          var index_a = store_a.createIndex("test store a", "test_date");
        };

        open.onsuccess = function () {
          var db = open.result;
          var tx = db.transaction("test store a", "readwrite");
          var store_a = tx.objectStore("test store a");

          let buffer = new ArrayBuffer(100000 * 1024);
          let buffer_view = new Uint8Array(buffer);
          buffer_view.fill(42, 0, 1024);

          store_a.put({
            id: 3,
            buffer: buffer,
            buffer_view: buffer_view,
          });

          tx.oncomplete = function () {
            db.close();
          };
        };
      })();
    </script>
  </body>
</html>
